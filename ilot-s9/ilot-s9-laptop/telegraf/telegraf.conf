# ---------------------------------------------------------------------------
# Telegraf — pont entre le broker central et InfluxDB
# ---------------------------------------------------------------------------

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# --- Telemetrie -------------------------------------------------------------
# Topics attendus :  <ilot>/tel/<device>/<metrique>
# Charge utile     :  objet JSON plat, ex. {"value": 21.4}
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["+/tel/+/+"]
  qos = 1
  client_id = "telegraf-ilot"
  data_format = "json"
  name_override = "telemetrie"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/tel/+/+"
    tags = "ilot/_/device/metrique"

# --- Evenements -------------------------------------------------------------
# Topics attendus :  <ilot>/evt/<device>/<type>
# Sert au TP OTA (evt/<device>/ota) et au module incident.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["+/evt/+/+"]
  qos = 1
  client_id = "telegraf-ilot-evt"
  data_format = "json"
  json_string_fields = ["version", "raison", "message"]
  name_override = "evenements"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/evt/+/+"
    tags = "ilot/_/device/type"

# --- Etat / presence --------------------------------------------------------
# Topic retenu <ilot>/st/<device>, publie a la connexion et via le LWT.
# C'est cette serie qui alimente l'alerte "device muet".
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["+/st/+"]
  qos = 1
  client_id = "telegraf-ilot-st"
  data_format = "value"
  data_type = "string"
  name_override = "etat"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/st/+"
    tags = "ilot/_/device"

# --- Sortie -----------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "iot-s9-token-a-changer"
  organization = "ecole"
  bucket = "iot"
