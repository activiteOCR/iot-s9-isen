# ---------------------------------------------------------------------------
# Stack de supervision d'ilot — tourne sur le laptop
#
#   docker compose up -d
#
# Identique sur Windows, macOS et Linux. Les ports sont publies sur l'hote,
# donc joignables depuis le Pi via le lien Ethernet : c'est la raison pour
# laquelle on passe par Docker Desktop plutot que par un service lance
# directement dans WSL (voir README.md).
#
#   1883  broker MQTT central (recoit les bridges des ilots)
#   8086  InfluxDB
#   3000  Grafana        ->  http://localhost:3000   admin / iot-s9
# ---------------------------------------------------------------------------

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ilot-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  influxdb:
    image: influxdb:2.7
    container_name: ilot-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: iot-s9-admin
      DOCKER_INFLUXDB_INIT_ORG: ecole
      DOCKER_INFLUXDB_INIT_BUCKET: iot
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: iot-s9-token-a-changer
    volumes:
      - influx-data:/var/lib/influxdb2

  telegraf:
    image: telegraf:1.30
    container_name: ilot-telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ilot-grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: iot-s9
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  mosquitto-data:
  mosquitto-log:
  influx-data:
  grafana-data:
