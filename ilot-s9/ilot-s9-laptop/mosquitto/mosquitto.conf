# ---------------------------------------------------------------------------
# Broker central de l'ilot — recoit le bridge du Pi
# ---------------------------------------------------------------------------

listener 1883 0.0.0.0

# Le Pi se connecte en bridge sans authentification pendant le chantier de
# validation. TP2 introduira les identifiants puis les certificats clients.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all
connection_messages true

# Les messages remontes par le bridge arrivent prefixes du nom de l'ilot :
#   ilot3/tel/dev01/temperature
#   ilot3/evt/dev02/ota
#   ilot3/st/dev01
#
# Pour federer les cinq ilots au module 4, chaque Pi bridge vers CE broker
# avec son propre prefixe : les topics ne se marchent pas dessus.
#
# Observer tout ce qui remonte :
#   mosquitto_sub -h localhost -t '#' -v
